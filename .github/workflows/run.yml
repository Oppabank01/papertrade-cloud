name: papertrade
on:
  schedule:
    - cron: "2-59/5 * * * *"   # off the :00 peak; GitHub drops/delays busy-minute schedules
  workflow_dispatch:
concurrency:
  group: papertrade
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python3 test_recipes.py && python3 test_wallets.py && python3 test_nightly.py
      - name: paper accounts
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: bash cloud.sh 2>&1 | tee -a run.log
      - name: save state
        run: |
          git config user.name "papertrade-bot"
          git config user.email "papertrade-bot@users.noreply.github.com"
          git add -A state*.json data/
          git diff --cached --quiet && exit 0
          git commit -q -m "paper state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
