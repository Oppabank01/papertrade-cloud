name: papertrade
on:
  schedule:
    - cron: "2-59/5 * * * *"   # off the :00 peak; GitHub drops/delays busy-minute schedules
  workflow_dispatch:
  # watchdog: the claude.ai routines push these files 3x a day; a push restarts the chain if it broke.
  # Bot pushes use GITHUB_TOKEN and never trigger this. A spare run is harmless: the group keeps
  # at most one pending run, so the chain's own dispatch cancels it.
  push:
    branches: [main]
    paths: [data/iterate_log.md, data/x_research_log.md, x_recipes.json, lessons.md]
concurrency:
  group: papertrade
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # lets a run dispatch the next one (GitHub's own scheduler never fired for this repo)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # laya (local decision model for the fast-agents and v2 accounts, moved from the Mac 14 Nov): venv + model cached
      - id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements-laya.txt') }}
      - name: laya deps
        if: steps.venv.outputs.cache-hit != 'true'
        run: python3 -m venv ~/venv && ~/venv/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-laya.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: laya-hf-0.3.21
      - run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: tests
        run: python3 test_recipes.py && python3 test_wallets.py && python3 test_nightly.py && python3 test_zoo.py && python3 test_majors.py && python3 test_agents.py && python3 test_hype.py && python3 test_grok_v2.py
      - name: paper accounts
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: bash cloud.sh 2>&1 | tee -a run.log
      - name: save state
        run: |
          git config user.name "papertrade-bot"
          git config user.email "papertrade-bot@users.noreply.github.com"
          git add -A state*.json ghosts_grok.json data/
          git diff --cached --quiet && exit 0
          git commit -q -m "paper state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: start the API iteration every 3 hours (Bangkok), skipping 12 when the routine runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$((10#$(TZ=Asia/Bangkok date +%H)))
          case $h in 0|3|6|9|15|18|21) ;; *) exit 0 ;; esac
          last=$(gh run list -R ${{ github.repository }} -w iterate -L 1 --json createdAt --jq '.[0].createdAt // ""')
          [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 7200 ] && exit 0
          gh workflow run iterate -R ${{ github.repository }}
      - name: chain next run in ~5 min
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5   # the wait now happens inside cloud.sh with the exit watcher running
          gh workflow run papertrade -R ${{ github.repository }}
